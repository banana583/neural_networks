[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab2-random-matrices"
version = "1.0.0"
description = "Laboratory work 2: spacing statistics of random symmetric matrices"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Балданова Евгения"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
